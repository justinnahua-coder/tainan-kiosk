<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kiosk 時鐘・天氣・備忘錄</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif;
    height: 100vh; width: 100vw;
    overflow: hidden;
    display: flex;
    color: #fff;
    background: #0f0c29;
    user-select: none; -webkit-user-select: none;
  }
  .bg-layer { position: fixed; inset: 0; z-index: 0; transition: background 1.5s ease; }
  .bg-day    { background: linear-gradient(145deg, #2193b0 0%, #6dd5ed 40%, #f7d794 80%, #f8b500 100%); }
  .bg-sunset { background: linear-gradient(145deg, #fc4a1a 0%, #f7b733 40%, #fdc830 70%, #f5af19 100%); }
  .bg-night  { background: linear-gradient(145deg, #0f0c29 0%, #302b63 40%, #24243e 70%, #1a1a2e 100%); }
  .bg-dawn   { background: linear-gradient(145deg, #2c3e50 0%, #3498db 35%, #a8d8ea 65%, #fdcb6e 100%); }
  .particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .particle { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.08); animation: float linear infinite; }
  @keyframes float { 0%{transform:translateY(100vh) scale(0);opacity:0} 10%{opacity:.6} 90%{opacity:.4} 100%{transform:translateY(-10vh) scale(1);opacity:0} }

  .layout {
    position: relative; z-index: 2;
    display: flex; width: 100%; height: 100%;
    padding: 2% 3%;
    text-shadow: 0 2px 20px rgba(0,0,0,.25);
  }

  /* ========== 左側 ========== */
  .left-panel {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: flex-start;
    padding: 2% 4%;
  }
  .date-solar { font-size:clamp(1rem,3vw,1.6rem);font-weight:400;letter-spacing:.10em;opacity:.9;margin-bottom:.3em; }
  .date-lunar { font-size:clamp(.8rem,2.4vw,1.2rem);font-weight:300;opacity:.65;margin-bottom:.3em;letter-spacing:.06em; }
  .festival-badge {
    display:inline-block;font-size:clamp(.75rem,2.2vw,1.1rem);font-weight:500;
    padding:.2em 1em;border-radius:30px;margin-bottom:.8em;
    background:rgba(255,215,0,.20);border:1px solid rgba(255,215,0,.30);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);letter-spacing:.04em;
  }
  .festival-badge.holiday { background:rgba(255,107,107,.20);border-color:rgba(255,107,107,.35); }
  .festival-badge.none { display:none; }

  .time { font-size:clamp(3rem,16vw,7rem);font-weight:700;line-height:1;letter-spacing:.04em;margin-bottom:.5em;font-variant-numeric:tabular-nums; }
  .time .seconds { font-size:.35em;font-weight:300;opacity:.6;vertical-align:super;margin-left:.08em; }

  .weather-row {
    display:flex;align-items:center;gap:2.5%;
    padding:.8em 2em;border-radius:36px;margin-bottom:.4em;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.15);
    box-shadow:0 8px 32px rgba(0,0,0,.12);
  }
  .weather-icon { font-size:clamp(1.8rem,5.5vw,3.2rem);line-height:1;filter:drop-shadow(0 2px 8px rgba(0,0,0,.15)); }
  .weather-temp { font-size:clamp(1.4rem,5vw,2.6rem);font-weight:600;line-height:1; }
  .weather-temp .celsius { font-size:.5em;font-weight:300;opacity:.7; }
  .weather-desc { font-size:clamp(.75rem,2.2vw,1.1rem);font-weight:400;opacity:.8;letter-spacing:.04em; }
  .weather-extras { display:flex;gap:8%;font-size:clamp(.6rem,1.8vw,.9rem);opacity:.6;margin-top:.15em; }

  .bottom-bar {
    margin-top: auto;
    font-size:clamp(.5rem,1.4vw,.7rem);opacity:.3;letter-spacing:.03em;
  }

  .left-center {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: flex-start; justify-content: center;
  }

  /* ========== 右側（留言備忘錄） ========== */
  .right-panel {
    flex: 0 0 45%;
    display: flex; flex-direction: column;
    padding: 2.5% 3% 2.5% 1.5%;
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: 28px;
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 8px 32px rgba(0,0,0,.12);
    margin: 1.5% 0;
  }

  .memo-header {
    font-size:clamp(1rem,2.8vw,1.5rem);font-weight:600;letter-spacing:.06em;
    padding: 0 .3em .5em .3em;
    border-bottom: 1px solid rgba(255,255,255,.10);
    flex-shrink: 0;
  }
  .memo-header small {
    font-weight:300; font-size:.55em; opacity:.45; margin-left:.6em;
  }

  .memo-content {
    flex: 1; overflow-y: auto;
    padding: .6em .3em;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.15) transparent;
    font-size:clamp(.95rem,2.6vw,1.4rem);
    line-height: 1.6;
    letter-spacing: .04em;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .memo-content::-webkit-scrollbar { width: 4px; }
  .memo-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

  .memo-empty {
    text-align: center; opacity: .25; font-size:clamp(.8rem,2vw,1rem);
    padding: 2em 0; letter-spacing:.04em;
  }

  .memo-updated {
    font-size:clamp(.5rem,1.4vw,.7rem); opacity:.25;
    padding: .4em .3em 0 .3em;
    border-top: 1px solid rgba(255,255,255,.06);
    flex-shrink: 0;
  }

  /* ===== 響應式 ===== */
  @media (max-width: 600px) {
    .layout { flex-direction: column; padding: 3% 4%; }
    .left-panel { padding: 1% 0; align-items: center; }
    .left-center { align-items: center; }
    .right-panel { flex: 1; padding: 4% 4%; margin: 2% 0 0 0; }
  }
</style>
</head>
<body>
<div class="bg-layer" id="bgLayer"></div>
<div class="particles" id="particles"></div>

<div class="layout">
  <!-- ====== 左側 ====== -->
  <div class="left-panel">
    <div class="left-center">
    <div class="date-solar" id="dateSolar"></div>
    <div class="date-lunar" id="dateLunar">載入中…</div>
    <div class="festival-badge none" id="festivalBadge">🎉 </div>

    <div class="time">
      <span id="hours">--</span>:<span id="minutes">--</span><span class="seconds" id="seconds">--</span>
    </div>

    <div class="weather-row">
      <div class="weather-icon" id="weatherIcon">🌤️</div>
      <div>
        <div class="weather-temp"><span id="temp">--</span><span class="celsius">°C</span></div>
        <div class="weather-desc" id="weatherDesc">載入中…</div>
        <div class="weather-extras"><span>💧 <span id="humidity">--</span>%</span><span>🌬️ <span id="windSpeed">--</span> km/h</span></div>
      </div>
    </div>

    </div>  <!-- .left-center -->

    <div class="bottom-bar"><span>📍 台南</span>　<span>🔄 <span id="lastUpdate">--</span></span></div>
  </div>

  <!-- ====== 右側（留言備忘錄） ====== -->
  <div class="right-panel" id="memoPanel">
    <div class="memo-header">
      📝 留言備忘錄
      <small>由小愛更新</small>
    </div>

    <div class="memo-content" id="memoContent">
      <div class="memo-empty">目前無留言<br>告訴小愛，我來幫您記錄 ✏️</div>
    </div>

    <div class="memo-updated" id="memoUpdated"></div>
  </div>
</div>

const NY=[[1900,1,31],[1901,2,19],[1902,2,8],[1903,1,29],[1904,2,16],[1905,2,4],[1906,1,25],[1907,2,13],[1908,2,2],[1909,1,22],[1910,2,10],[1911,1,30],[1912,2,18],[1913,2,6],[1914,1,26],[1915,2,14],[1916,2,3],[1917,1,23],[1918,2,11],[1919,2,1],[1920,2,20],[1921,2,8],[1922,1,28],[1923,2,16],[1924,2,5],[1925,1,24],[1926,2,13],[1927,2,2],[1928,1,23],[1929,2,10],[1930,1,30],[1931,2,17],[1932,2,6],[1933,1,26],[1934,2,14],[1935,2,4],[1936,1,24],[1937,2,11],[1938,1,31],[1939,2,19],[1940,2,8],[1941,1,27],[1942,2,15],[1943,2,5],[1944,1,25],[1945,2,13],[1946,2,2],[1947,1,22],[1948,2,10],[1949,1,29],[1950,2,17],[1951,2,6],[1952,1,27],[1953,2,14],[1954,2,3],[1955,1,24],[1956,2,12],[1957,1,31],[1958,2,18],[1959,2,8],[1960,1,28],[1961,2,15],[1962,2,5],[1963,1,25],[1964,2,13],[1965,2,2],[1966,1,21],[1967,2,9],[1968,1,30],[1969,2,17],[1970,2,6],[1971,1,27],[1972,2,15],[1973,2,3],[1974,1,23],[1975,2,11],[1976,1,31],[1977,2,18],[1978,2,7],[1979,1,28],[1980,2,16],[1981,2,5],[1982,1,25],[1983,2,13],[1984,2,2],[1985,2,20],[1986,2,9],[1987,1,29],[1988,2,17],[1989,2,6],[1990,1,27],[1991,2,15],[1992,2,4],[1993,1,23],[1994,2,10],[1995,1,31],[1996,2,19],[1997,2,7],[1998,1,28],[1999,2,16],[2000,2,5],[2001,1,24],[2002,2,12],[2003,2,1],[2004,1,22],[2005,2,9],[2006,1,29],[2007,2,18],[2008,2,7],[2009,1,26],[2010,2,14],[2011,2,3],[2012,1,23],[2013,2,10],[2014,1,31],[2015,2,19],[2016,2,8],[2017,1,28],[2018,2,16],[2019,2,5],[2020,1,25],[2021,2,12],[2022,2,1],[2023,1,22],[2024,2,10],[2025,1,29],[2026,2,17],[2027,2,6],[2028,1,26],[2029,2,13],[2030,2,3],[2031,1,23],[2032,2,11],[2033,1,31],[2034,2,19],[2035,2,8],[2036,1,28],[2037,2,15],[2038,2,4],[2039,1,24],[2040,2,12],[2041,2,1],[2042,1,22],[2043,2,10],[2044,1,29],[2045,2,17],[2046,2,6],[2047,1,26],[2048,2,14],[2049,2,2],[2050,1,23],[2051,2,11],[2052,1,31],[2053,2,18],[2054,2,7],[2055,1,28],[2056,2,15],[2057,2,4],[2058,1,24],[2059,2,11],[2060,2,1],[2061,1,21],[2062,2,9],[2063,1,29],[2064,2,17],[2065,2,5],[2066,1,26],[2067,2,14],[2068,2,3],[2069,1,23],[2070,2,11],[2071,1,31],[2072,2,19],[2073,2,7],[2074,1,27],[2075,2,15],[2076,2,5],[2077,1,24],[2078,2,12],[2079,2,2],[2080,1,22],[2081,2,9],[2082,1,29],[2083,2,17],[2084,2,6],[2085,1,26],[2086,2,14],[2087,2,3],[2088,1,24],[2089,2,10],[2090,1,30],[2091,2,18],[2092,2,7],[2093,1,27],[2094,2,15],[2095,2,5],[2096,1,25],[2097,2,12],[2098,2,1],[2099,1,21]];

function JD(y,m,d){if(m<=2){y--;m+=12;}var A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;}
function md(idx,mi,leap){var info=LI[idx];if(leap) return ((info>>20)&1)?30:29;return ((info>>(11-(mi-1)))&1)?30:29;}
function gl(idx){return(LI[idx]>>16)&0xF;}
function s2l(sy,sm,sd){
  var tj=JD(sy,sm,sd),ly=1900,idx=0;
  while(idx<NY.length-1&&JD(NY[idx+1][0],NY[idx+1][1],NY[idx+1][2])<=tj){idx++;ly++;}
  var startJD=JD(NY[idx][0],NY[idx][1],NY[idx][2]),off=Math.round(tj-startJD);
  var info=LI[idx],leap=gl(idx),lm=1,isleap=false,rem=off;
  for(var i=1;i<=12;i++){var mdd=md(idx,i,false);if(rem<mdd){lm=i;break;}rem-=mdd;if(leap===i){var ld=md(idx,i,true);if(rem<ld){lm=i;isleap=true;break;}rem-=ld;}if(i===12) lm=1;}
  var ld=rem+1;if(ld<1||ld>30){lm=1;ld=1;}
  var gn=(ly-4)%10;if(gn<0)gn+=10;var ge=(ly-4)%12;if(ge<0)ge+=12;

  return {year:ly,month:lm,day:ld,isLeap:isleap,gzY:TG[gn]+DZ[ge],sx:SX[ge],gzD:TG[dgz%10]+DZ[dgz%12]+'日',jq:getJQ(sy,sm,sd)};

function getJQ(y,m,d){var n=['立春','雨水','驚蟄','春分','清明','穀雨','立夏','小滿','芒種','夏至','小暑','大暑','立秋','處暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至','小寒','大寒'];var b=[[2,3],[2,18],[3,5],[3,20],[4,4],[4,20],[5,5],[5,21],[6,5],[6,21],[7,7],[7,22],[8,7],[8,23],[9,7],[9,23],[10,8],[10,23],[11,7],[11,22],[12,7],[12,21],[1,5],[1,20]];var o=Math.round((y-2025)*0.2422);for(var i=0;i<24;i++){if(b[i][0]===m&&Math.round(b[i][1]+o)===d)return n[i];}return null;}

function bgC(h){if(h>=5&&h<8)return'bg-dawn';if(h>=8&&h<17)return'bg-day';if(h>=17&&h<19)return'bg-sunset';return'bg-night';}
function P2(n){return String(n).padStart(2,'0');}

function updateClock(){
  var n=new Date(),h=n.getHours(),m=n.getMinutes(),s=n.getSeconds();
  bgLayer.className='bg-layer '+bgC(h);h=h%12||12;
  hoursEl.textContent=P2(h);minutesEl.textContent=P2(m);secondsEl.textContent=P2(s);
  var wd=['日','一','二','三','四','五','六'],y=n.getFullYear(),mo=n.getMonth()+1,d=n.getDate();
  dateSolar.textContent=y+'年'+mo+'月'+d+'日 星期'+wd[n.getDay()];
  var l=s2l(y,mo,d);
  if(l){var ms=(l.isLeap?'閏':'')+LMON[l.month-1],ds=LDAY[l.day-1]||l.day+'日';dateLunar.textContent='農曆 '+l.gzY+'('+l.sx+')年 '+ms+'月'+ds+'  '+l.gzD;var f=getFest(mo,d,l.month,l.day,l.isLeap,l.jq);if(f){festivalEl.textContent=f;festivalEl.className='festival-badge '+(f.startsWith('🔴')?'holiday':'festival');}else festivalEl.className='festival-badge none';}
}

async function updateWeather(){
  iconEl.textContent='';tempEl.textContent='--';descEl.textContent='更新中…';humidityEl.textContent='--';windEl.textContent='';
  try{var r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=22.9997&longitude=120.2270&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=Asia%2FTaipei&forecast_days=1');if(!r.ok)throw Error();var c=(await r.json()).current,wc=c.weather_code;var i=wc===0?['☀️','晴朗']:wc===1?['🌤️','晴時多雲']:wc===2?['⛅','多雲時晴']:wc===3?['☁️','陰天']:wc<=19?['🌫️','霧霾']:wc<=29?['🌧️','陣雨']:wc<=39?['⛈️','雷雨']:wc<=49?['🌫️','濃霧']:wc<=59?['🌧️','毛毛雨']:wc<=69?['🌧️','降雨']:wc<=84?['🌦️','陣雨']:wc<=99?['⛈️','強烈雷雨']:['🌤️','未知'];iconEl.textContent=i[0];tempEl.textContent=Math.round(c.temperature_2m);descEl.textContent=i[1]+'（體感 '+Math.round(c.apparent_temperature)+'°）';humidityEl.textContent=c.relative_humidity_2m;windEl.textContent=Math.round(c.wind_speed_10m)+' km/h';var n2=new Date();updateEl.textContent=n2.getHours()+':'+P2(n2.getMinutes());
  }catch(e){descEl.textContent='⚠️ 連線失敗';iconEl.textContent='⚠️';}
}

function initParticles(){
  var c=$('particles');
  for(var i=0;i<16;i++){var p=document.createElement('div');p.className='particle';var sz=2+Math.random()*6;p.style.width=sz+'px';p.style.height=sz+'px';p.style.left=(5+Math.random()*90)+'%';p.style.animationDuration=(10+Math.random()*25)+'s';p.style.animationDelay=(Math.random()*15)+'s';c.appendChild(p);}
}

// ============================================================
// 留言備忘錄 — 由小愛更新（老闆口述我來寫）
// ============================================================
// 初始備忘錄內容（空）
let currentMemo = '';

function renderMemo() {
  if (currentMemo && currentMemo.trim()) {
    memoContent.textContent = currentMemo;
    memoContent.className = 'memo-content';
  } else {
    memoContent.innerHTML = '<div class="memo-empty">目前無留言<br>告訴小愛，我來幫您記錄 ✏️</div>';
  }
}

// 老闆呼叫此函數來更新備忘錄
// 用法：updateMemo("留言內容");
function updateMemo(text) {
  currentMemo = text;
  renderMemo();
  var n = new Date();
  var y = n.getFullYear(), mo = n.getMonth()+1, d = n.getDate();
  var h = n.getHours(), mi = n.getMinutes();
  memoUpdated.textContent = '📅 最後更新：' + y + '年' + mo + '月' + d + '日 ' + P2(h) + ':' + P2(mi);
}

// 啟動
updateClock(); updateWeather(); initParticles();
renderMemo();
setInterval(updateClock, 500); setInterval(updateWeather, 600000);
</script>
