const LUNAR_FEST_NM={'1/1':'🔴 春節','1/9':'🎉 天公生','1/15':'🎉 元宵節','2/2':'🎉 龍抬頭','3/3':'🎉 上巳節','4/8':'🎉 浴佛節','5/5':'🔴 端午節','7/7':'🎉 七夕','7/15':'🎉 中元節','8/15':'🔴 中秋節','9/9':'🎉 重陽節','12/8':'🎉 臘八節','12/16':'🎉 尾牙','12/24':'🎉 送神','12/30':'🔴 除夕','12/29':'🔴 除夕'};

// ============= 農曆轉換（查表法）- 1900-2100 =============

// 格式：[年, 月, 日, 農曆年, 農曆月, 農曆日, 是否閏月]
// 或者動態計算

// 使用經典農曆編碼（修正版）
// 每年編碼: bit19-16=閏月(0=無), bit20=閏月大小, bit11-0=1-12月大小(1=30,0=29)
const LI = [
  0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,

  0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
  0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
  0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
  0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
  0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
  0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,
  0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
  0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
  0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
  0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
  0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
  0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06a20,0x1a6c4,0x0aae0,
  0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
  0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
  0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,

];

// LI[0]=農曆1900年(庚子) = 公曆1900/1/31開始
// 每個農曆年正月初一對應的公曆日期
const NY = [
 [1900,1,31],[1901,2,19],[1902,2,8],[1903,1,29],[1904,2,16],[1905,2,4],[1906,1,25],[1907,2,13],[1908,2,2],[1909,1,22],
 [1910,2,10],[1911,1,30],[1912,2,18],[1913,2,6],[1914,1,26],[1915,2,14],[1916,2,3],[1917,1,23],[1918,2,11],[1919,2,1],
 [1920,2,20],[1921,2,8],[1922,1,28],[1923,2,16],[1924,2,5],[1925,1,24],[1926,2,13],[1927,2,2],[1928,1,23],[1929,2,10],
 [1930,1,30],[1931,2,17],[1932,2,6],[1933,1,26],[1934,2,14],[1935,2,4],[1936,1,24],[1937,2,11],[1938,1,31],[1939,2,19],
 [1940,2,8],[1941,1,27],[1942,2,15],[1943,2,5],[1944,1,25],[1945,2,13],[1946,2,2],[1947,1,22],[1948,2,10],[1949,1,29],

 [1960,1,28],[1961,2,15],[1962,2,5],[1963,1,25],[1964,2,13],[1965,2,2],[1966,1,21],[1967,2,9],[1968,1,30],[1969,2,17],
 [1970,2,6],[1971,1,27],[1972,2,15],[1973,2,3],[1974,1,23],[1975,2,11],[1976,1,31],[1977,2,18],[1978,2,7],[1979,1,28],
 [1980,2,16],[1981,2,5],[1982,1,25],[1983,2,13],[1984,2,2],[1985,2,20],[1986,2,9],[1987,1,29],[1988,2,17],[1989,2,6],
 [1990,1,27],[1991,2,15],[1992,2,4],[1993,1,23],[1994,2,10],[1995,1,31],[1996,2,19],[1997,2,7],[1998,1,28],[1999,2,16],
 [2000,2,5],[2001,1,24],[2002,2,12],[2003,2,1],[2004,1,22],[2005,2,9],[2006,1,29],[2007,2,18],[2008,2,7],[2009,1,26],
 [2010,2,14],[2011,2,3],[2012,1,23],[2013,2,10],[2014,1,31],[2015,2,19],[2016,2,8],[2017,1,28],[2018,2,16],[2019,2,5],
 [2020,1,25],[2021,2,12],[2022,2,1],[2023,1,22],[2024,2,10],[2025,1,29],[2026,2,17],[2027,2,6],[2028,1,26],[2029,2,13],
 [2030,2,3],[2031,1,23],[2032,2,11],[2033,1,31],[2034,2,19],[2035,2,8],[2036,1,28],[2037,2,15],[2038,2,4],[2039,1,24],
 [2040,2,12],[2041,2,1],[2042,1,22],[2043,2,10],[2044,1,29],[2045,2,17],[2046,2,6],[2047,1,26],[2048,2,14],[2049,2,2],
 [2050,1,23],[2051,2,11],[2052,1,31],[2053,2,18],[2054,2,7],[2055,1,28],[2056,2,15],[2057,2,4],[2058,1,24],[2059,2,11],
 [2060,2,1],[2061,1,21],[2062,2,9],[2063,1,29],[2064,2,17],[2065,2,5],[2066,1,26],[2067,2,14],[2068,2,3],[2069,1,23],
 [2070,2,11],[2071,1,31],[2072,2,19],[2073,2,7],[2074,1,27],[2075,2,15],[2076,2,5],[2077,1,24],[2078,2,12],[2079,2,2],
 [2080,1,22],[2081,2,9],[2082,1,29],[2083,2,17],[2084,2,6],[2085,1,26],[2086,2,14],[2087,2,3],[2088,1,24],[2089,2,10],
 [2090,1,30],[2091,2,18],[2092,2,7],[2093,1,27],[2094,2,15],[2095,2,5],[2096,1,25],[2097,2,12],[2098,2,1],[2099,1,21],
];

const LMON=['正','二','三','四','五','六','七','八','九','十','冬','臘'];
const LDAY=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
  '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
  '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
const TG=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const DZ=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const SX=['鼠','牛','虎','兔','龍','蛇','馬','羊','猴','雞','狗','豬'];

// 儒略日
function JD(y,m,d) {
  if(m<=2){y--;m+=12;}
  var A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;
}

// 農曆年天數
function yearDays(idx){
  var info=LI[idx],sum=0;
  for(var i=0;i<12;i++) sum+=((info>>(11-i))&1)?30:29;
  var leap=(info>>16)&0xF;
  if(leap>0) sum+=((info>>20)&1)?30:29;
  return sum;
}

// 某月天數
function monthDays(idx,mi,leap){
  var info=LI[idx];
  if(leap) return ((info>>20)&1)?30:29;
  return ((info>>(11-(mi-1)))&1)?30:29;
}

// 閏月
function getLeap(idx){
  return (LI[idx]>>16)&0xF;
}

// 公曆 → 農曆
function s2l(sy,sm,sd){
  // 先找最近的下一個農曆年正月初一前
  var targetJD=JD(sy,sm,sd);
  var ly=1900, idx=0;

  // 找正月初一 <= targetJD 的最後一個農曆年
  while(idx<NY.length-1 && JD(NY[idx+1][0],NY[idx+1][1],NY[idx+1][2])<=targetJD){
    idx++;
    ly++;
  }

  var ny=NY[idx]; // 農曆ly年正月初一的公曆日期
  var startJD=JD(ny[0],ny[1],ny[2]);
  var offset=Math.round(targetJD-startJD); // 距正月初一的天數

  // 遍歷月份
  var info=LI[idx];
  var leap=getLeap(idx);
  var lm=1, isLeap=false;
  var remaining=offset;

  for(var i=1;i<=12;i++){
    var md=monthDays(idx,i,false);
    if(remaining<md){ lm=i; break; }
    remaining-=md;
    if(leap===i){
      var ld=monthDays(idx,i,true);
      if(remaining<ld){ lm=i; isLeap=true; break; }
      remaining-=ld;
    }
    if(i===12){ lm=1; } // 到年底（實際上不會發生，offset 不應超過全年）
  }

  var lday=remaining+1;
  // 安全處理
  if(lday<1||lday>30){ lm=1; lday=1; }

  // 干支
  var gzN=(ly-4)%10; if(gzN<0)gzN+=10;
  var gzE=(ly-4)%12; if(gzE<0)gzE+=12;
  var gzY=TG[gzN]+DZ[gzE];
  var sx=SX[gzE];

  var dgz=Math.floor(targetJD+0.5)%60; if(dgz<0)dgz+=60;
  var dg=dgz%10,dz2=dgz%12;
  var gzD=TG[dg]+DZ[dz2]+'日';

  var jq=getJieQi(sy,sm,sd);

  return {year:ly,month:lm,day:lday,isLeap:isLeap,ganZhiYear:gzY+'('+sx+')',ganZhiDay:gzD,jieQi:jq};
}

function getJieQi(y,m,d){
  var n=['立春','雨水','驚蟄','春分','清明','穀雨','立夏','小滿','芒種','夏至','小暑','大暑',
    '立秋','處暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至','小寒','大寒'];
  var b=[[2,3],[2,18],[3,5],[3,20],[4,4],[4,20],[5,5],[5,21],[6,5],[6,21],[7,7],[7,22],
    [8,7],[8,23],[9,7],[9,23],[10,8],[10,23],[11,7],[11,22],[12,7],[12,21],[1,5],[1,20]];
  var o=Math.round((y-2025)*0.2422);
  for(var i=0;i<24;i++){ if(b[i][0]===m&&Math.round(b[i][1]+o)===d) return n[i]; }
  return null;
}

function getFest(sm,sd,lm,ld,isLeap,jq){
  var k=sm+'/'+sd;
  if(SOLAR_FEST[k]) return SOLAR_FEST[k];
  if(!isLeap){ var lk=lm+'/'+ld; if(LUNAR_FEST_NM[lk]) return LUNAR_FEST_NM[lk]; }
  if(jq) return '🎋 '+jq;
  return null;
}

function bgClass(h){
  if(h>=5&&h<8) return 'bg-dawn';
  if(h>=8&&h<17) return 'bg-day';
  if(h>=17&&h<19) return 'bg-sunset';
  return 'bg-night';
}
function P2(n){return String(n).padStart(2,'0');}

function updateClock(){
  var n=new Date();
  var h=n.getHours(),m=n.getMinutes(),s=n.getSeconds();
  bgLayer.className='bg-layer '+bgClass(h);
  h=h%12||12;
  hoursEl.textContent=P2(h); minutesEl.textContent=P2(m); secondsEl.textContent=P2(s);

  var wd=['日','一','二','三','四','五','六'];
  var y=n.getFullYear(),mo=n.getMonth()+1,d=n.getDate();
  dateSolar.textContent=y+'年'+mo+'月'+d+'日 星期'+wd[n.getDay()];

  var l=s2l(y,mo,d);
  if(l){
    var ms=(l.isLeap?'閏':'')+LMON[l.month-1];
    var ds=LDAY[l.day-1]||l.day+'日';
    dateLunar.textContent='農曆 '+l.ganZhiYear+'年 '+ms+'月'+ds+'  '+l.ganZhiDay;

    var f=getFest(mo,d,l.month,l.day,l.isLeap,l.jieQi);
    if(f){
      festivalEl.textContent=f;
      festivalEl.className='festival-badge '+(f.startsWith('🔴')?'holiday':'festival');
    } else festivalEl.className='festival-badge none';
  }
}

async function updateWeather(){
  iconEl.textContent='';tempEl.textContent='--';descEl.textContent='更新中…';humidityEl.textContent='--';windEl.textContent='';
  try{
    var r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=22.9997&longitude=120.2270&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=Asia%2FTaipei&forecast_days=1');
    if(!r.ok) throw Error();
    var c=(await r.json()).current;
    var wc=c.weather_code;
    var i=wc===0?['☀️','晴朗']:wc===1?['🌤️','晴時多雲']:wc===2?['⛅','多雲時晴']:wc===3?['☁️','陰天']:wc<=19?['🌫️','霧霾']:wc<=29?['🌧️','陣雨']:wc<=39?['⛈️','雷雨']:wc<=49?['🌫️','濃霧']:wc<=59?['🌧️','毛毛雨']:wc<=69?['🌧️','降雨']:wc<=84?['🌦️','陣雨']:wc<=99?['⛈️','強烈雷雨']:['🌤️','未知'];
    iconEl.textContent=i[0]; tempEl.textContent=Math.round(c.temperature_2m);
    descEl.textContent=i[1]+'（體感 '+Math.round(c.apparent_temperature)+'°）';
    humidityEl.textContent=c.relative_humidity_2m; windEl.textContent=Math.round(c.wind_speed_10m)+' km/h';
    var n2=new Date(); updateEl.textContent=n2.getHours()+':'+P2(n2.getMinutes());
  }catch(e){descEl.textContent='⚠️ 連線失敗';iconEl.textContent='⚠️';}
}

function initParticles(){
  var c=$('particles');
  for(var i=0;i<16;i++){
    var p=document.createElement('div');p.className='particle';
    var sz=2+Math.random()*6;p.style.width=sz+'px';p.style.height=sz+'px';
    p.style.left=(5+Math.random()*90)+'%';
    p.style.animationDuration=(10+Math.random()*25)+'s';p.style.animationDelay=(Math.random()*15)+'s';
    c.appendChild(p);
  }
}

updateClock(); updateWeather(); initParticles();
setInterval(updateClock,500); setInterval(updateWeather,600000);
</script>
